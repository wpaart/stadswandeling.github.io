<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leuven city walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="map" aria-label="Map of the city walk"></div>

<header id="title">
  <h1 id="walk-title">Leuven city walk</h1>
  <p id="walk-meta">Loading…</p>
</header>

<div class="fabs">
  <button id="locate" class="fab" aria-label="Show my location" title="Show my location">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
  </button>
  <button id="follow" class="fab" aria-pressed="false" aria-label="Follow me" title="Keep the map centred on me" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2 4.5 21 12 17l7.5 4z"/></svg>
  </button>
</div>

<div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Full-size photo">
  <button id="lb-close" aria-label="Close photo">&times;</button>
  <div id="lb-scroll"><img id="lb-img" alt=""></div>
  <p id="lb-cap"></p>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<section id="sheet" class="collapsed">
  <button id="handle" aria-label="Expand or collapse panel"><span></span></button>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-walk" class="on" data-p="walk">Walk</button>
    <button role="tab" id="tab-photos" data-p="photos">Photos <b id="photo-count">0</b></button>
  </nav>
  <div id="panel-walk" class="panel"></div>
  <div id="panel-photos" class="panel" hidden>
    <label class="radius">Show as “near you” within
      <select id="radius">
        <option value="30">30 m</option>
        <option value="60" selected>60 m</option>
        <option value="120">120 m</option>
        <option value="250">250 m</option>
      </select>
    </label>
    <div id="photo-list"></div>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
